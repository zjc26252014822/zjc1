name: Build Stheno RootHide Patch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [build-failure.log]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install RootHide Theos and SDK
        run: |
          set -euxo pipefail
          brew install ldid dpkg
          git clone --recursive --depth 1 https://github.com/roothide/theos.git /opt/theos
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk /opt/theos/sdks/
      - name: Build genuine arm64e RootHide package
        run: |
          set -o pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Commit build log on failure
        if: failure()
        run: |
          cp build.log build-failure.log || true
          git config user.name 'Stheno build bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-failure.log
          git diff --cached --quiet || git commit -m 'Record failed build log'
          git push
      - name: Upload logs and deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SthenoBounds-build-output
          path: |
            packages/*.deb
            build.log
          if-no-files-found: warn
