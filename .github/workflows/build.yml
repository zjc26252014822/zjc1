name: Build Stheno RootHide Patch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [build-failure.log]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and capture every diagnostic
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee build-failure.log) 2>&1
          set -x
          brew install ldid dpkg
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$RUNNER_TEMP/theos/sdks/"
          export THEOS="$RUNNER_TEMP/theos"
          make clean package FINALPACKAGE=1
      - name: Commit complete build diagnostic
        if: always()
        shell: bash
        run: |
          git config user.name 'Stheno build bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f build-failure.log || echo 'Workflow stopped before command logging started.' > build-failure.log
          git add -f build-failure.log
          git diff --cached --quiet || git commit -m 'Record Actions build diagnostic'
          git push origin HEAD:main
      - name: Upload package and diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SthenoBounds-build-output
          path: |
            packages/*.deb
            build-failure.log
          if-no-files-found: warn
      - name: Fail job after recording diagnostics
        if: steps.compile.outcome == 'failure'
        run: exit 1
